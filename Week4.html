<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>JQuery</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
</head>
<body>
    <div class="container">
        <div id="myCarousel" class="carousel slide">
            <ol class="carousel-indicators">
                <li class="item1-active"></li>
                <li class="item2"></li>
                <li class="item3"></li>
                <li class="item4"></li>
                <li class="item5"></li>
            </ol>
            <div class="carousel-inner" role="list item">
                <div class="item active">
                    <img src="download.jpg" width="1000" height="1000">
                </div>
                <div class="item">
                    <img src="download (1).jpg" width="1000" height="1000">
                </div>
                <div class="item">
                    <img src="download (2).jpg" width="1000" height="1000">
                </div>
                <div class="item">
                    <img src="download (3).jpg" width="1000" height="1000">
                </div>
                <div class="item">
                    <img src="download (4).jpg" width="1000" height="1000">
                </div>

            </div>
            <a class="left carousel-control" href="#myCarousel" role="button">
                <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="right carousel-control" href="#myCarousel" role="button">
                <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
        </div>
    </div>
    <script>
        $(document).ready(function(){
            $('.carousel').carousel();
            $(".item1").click(function(){
                $('.carousel').carousel(0);
            });
            $(".item2").click(function(){
                $('.carousel').carousel(1);
            });
            $(".item3").click(function(){
                $('.carousel').carousel(2);
            });
            $(".item4").click(function(){
                $('.carousel').carousel(3);
            });
            $(".item5").click(function(){
                $('.carousel').carousel(4);
            });
            $(".left").click(function(){
                $('.carousel').carousel("prev");
            });
            $(".right").click(function(){
                $('.carousel').carousel("next");
            });
        });
    </script>
</body>
</html>
