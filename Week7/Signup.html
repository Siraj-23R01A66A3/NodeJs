<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>SignUp</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#signUpForm").submit((event)=>{
                event.preventDefault();
                var name=$("#username").val();
                var work=$("#work").val();
                var password=$("#pwd").val();
                $.ajax({
                    url:"/register",
                    type:"POST",
                    contentType:"application/json",
                    dataType:"json",
                    data:JSON.stringify({name:name,work:work,password:password}),
                    success:function(data){
                        var tokenData=data;
                        if(tokenData.signup==false){
                            $("#msg").html('<h6>You are Already registered with us!!!</h6><br><a id="login-link" href="/login">login</a>');
                            
                        }
                        else{
                              $("#msg").html('<h6>Registration Successful</h6><br><a id="login-link" href="/login">login</a>');
                              $("#login-link").show();
                            window.location.href="/login";
                        }
                    },
                    error:function(data){
                        console.log("Something went wrong");
                    }
                });
        }); 
        });
    </script>
</head>
<body>
    <center>
        <h2>Sign Up</h2>
        <form id="signUpForm">
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br>
            <label for="work">Profession:</label><br>
            <input type="text" id="work" name="work" required><br>
            <label for="pwd">Password:</label><br>
            <input type="password" id="pwd" name="pwd" required><br><br>
            <input type="submit" value="Sign Up">
        </form>
        <div id="msg"></div>
    </center>
</body>
</html>
