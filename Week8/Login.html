<!DOCTYPE html>
<html>
<head>
    <title>Login page</title>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script>
        const form=$("#loginForm");
        $(document).ready(function(){
            $("#loginForm").submit((event)=>{
                event.preventDefault();
                var name=$("#username").val();
                var password=$("#pwd").val();
                $.ajax({
                    url:"/auth",
                    type:"POST",
                    contentType:"application/json",
                    dataType:"json",
                    data:JSON.stringify({
                        name:name,
                        password:password,
                    }),
                    success:function(data){
                        var tokenData=data;
                        if(tokenData.login==true){
                            console.log("token data:"+JSON.stringify(tokenData));
                            localStorage.setItem("username",tokenData.data[0].name);
                            localStorage.setItem("job",tokenData.data[0].work);
                            if(verifyLogin(tokenData.token)){
                                window.location.href="/welcome";

                            }
                            else{
                                alert("Authentication Failed");
                            }

                        }
                    },
                    error:function(data){
                        console.log("Something went wrong");
                    }
                });
             
                });
            });
            function verifyLogin(token){
                let result=true;
                $.ajax({
                    url:"/verifyToken",
                    type:"POST",
                    contentType:"application/json",
                    dataType:"json",
                    data:JSON.stringify({
                        token:token,
                    }),
                    success:function(data){
                        if(data.login==true){
                            result=true;
                    
                        }
                
                    else{
                        result=false;
                    }
                },
                error:function(data){
                    console.log("Wrong token, Not Authenticated");
                }
                });
                return result;
            }
    
    </script>
</head>
<body>
    <h2>Sign In</h2>
    <form id="loginForm">
        <label for="username">Userame:</label><br>
        <input type="text" id="username" name="username"><br>
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd"><br>
        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
