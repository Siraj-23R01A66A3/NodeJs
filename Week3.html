<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>User Registration and Login</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    <script src='main.js'></script>
    <style>
       body{
        display:flex;
        flex-direction:column;
        align-items:center;
        height:100vh;
        background-color: #f4f4f4;
       }
       table{
        margin-top: 200px;
        border-collapse: collapse;
        width: 300px;
        display:none;
       }
       td{
        padding:10px;
       }
       button{
        margin:5px;
        padding: 10px 5px;
        cursor: pointer;
        background-color: rgb(26, 186, 26);
       }
       input{
        width: 100%;
        padding: 10px;
        margin:5px 0px;
       }
    </style>
</head>
<body>
    <div>
        <button onClick="showForm('login')">Login</button>
        <button onClick="showForm('register')">Register</button>
    </div>
    <table id="formTable">
        <tbody>
            <tr id="loginRow" style="display:none;">
                <td>
                    <h2>LOGIN</h2>
                    <form onSubmit="return validateLogin()">
                        Username:<input type="text" id="loginUsername" placeholder="Username"required>
                        Password:<input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="submit">Submit</button>
                    </form>
                </td>
            </tr>
            <tr id="registerRow" style="display:none;">
                <td>
                    <h2>REGISTER</h2>
                    <form onSubmit="return validateRegister()">
                        Name:<input type="text" id="registerName" placeholder="Name" required>
                        Phone:<input type="number" id="registerPhone" placeholder="Phone" required maxlebngth="10">
                        Email Id:<input type="email" id="registerEmail" placeholder="Email" required>
                        Gender:<input type="radio" id="registerGender" name="gender" value="male">Male
                        <input type="radio" id="registerGender" name="gender" value="female">Female<br>
                        DOB:<input type="date" id="registerDob" placeholder="DOB" required>
                        Password:<input type="password" id="registerPassword" placeholder="Password" required>
                        <button type="submit">Submit</button>
                    </form> 
                </td>
            </tr>
        </tbody>
    </table>
    <script>
        function showForm(formType){
            document.getElementById('loginRow').style.display='none';
            document.getElementById('registerRow').style.display='none';
            document.getElementById('formTable').style.display='table';
            if(formType=='login'){
                document.getElementById('loginRow').style.display='table-row';
            }
            else{
                document.getElementById('registerRow').style.display='table-row';
            }
        }
        function validateLogin(){
            var username=document.getElementById('loginUsername').value;
            var password=document.getElementById('loginPassword').value;
            if(username==='' || password===''){
                alert("Please fill all the details");
                return false;
            }
            else{
                alert("Login sucessfull");
                return false;
            }
        }
        function validateRegister(){
            var name=document.getElementById('registerName').value;
            var phone=document.getElementById('registerPhone').value;
            var email=document.getElementById('registerEmail').value;
            var gender=document.getElementById('registerGender').value;
            var dob=document.getElementById('registerDob').value;
            var password=document.getElementById('registerPassword').value;
            if(name==='' || phone==='' || email==='' || gender==='' || dob==='' || password===''){
                alert("Please fill all the details");
                return false;
            }
            else{
                alert("Registration sucessfull");
                return false;
            }   
        
        const phonepattern=/^[0-9]{10}$/;
        const emailpattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!phone.match(phonepattern)){
            alert("Invalid phone number");
            return false;
        }
        if(!email.match(emailpattern)){
            alert("Invalid email");
            return false;

        }
        alert("Registration sucessfull");
        return false;
    }
    </script>
</body>
</html>
