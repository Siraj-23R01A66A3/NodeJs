<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Login page</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<style>
    h2{
        display:none;
    }
</style>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script>
        const form=$("#loginform");
        $(document).ready(function(){
            $("#loginform").submit((event)=>{
                event.preventDefault();
                var name=$("#username").val();
                var password=$("#pwd").val();
                $.ajax({
                    url:"/auth",
                    type:"POST",
                    contentType:"application/json",
                    dataType:"json",
                    data:JSON.stringify({
                        name:name,
                        password:password}),
                   
                    success:function(data){
                        var tokenData=data;
                        if(tokenData.login==true){
                        if(verifyLogin(tokenData.token)){
                            $("#verified").show();
                            $("#not_verified").hide();
                            alert("JWT Token:"+tokenData.token);
                        }
                    }
                        else{
                            $("#verified").hide();
                            $("#not_verified").show();
                            alert("Authentication Failed");
                        }
                        },
                        error:function(data){
                            console.log("Something went wrong");
                        }
                    });
                });
            });

                        function verifyLogin(token){
                          let result=true;
                          $.ajax({
                            url:"/verifyToken",
                            type:"POST",
                            contentType:"application/json",
                            dataType:"json",
                            data:JSON.stringify({
                          token:token,}),
                          success : function(data){
                            if(data.Login==true){
                                result=true;
                            }
                            else{
                                result=false;
                            }

                          },
                          error : function(data){
                            console.log("Wrong token,Not Authenticated.");
                          }
                          });
                          return result;
                        }

            
    </script>
   <body>
    <h2>Sign In</h2>
    <form id="loginform">
        <label for="username">Username:</label><br>
        <input type="text" id="username"name="username" placeholder="Username"><br>
        <label for="pwd">Password:</label><br>
        <input type="password" id="pwd" name="pwd" placeholder="Password"><br><br>
        <input type="submit" value="Submit">
        
    </form>
    <h2 id="verified">You are a verified user </h2>
     <h2 id="not_verified">You are not a verified user </h2>
   </body> 
</html>
